global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'eino-demo-monitor'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Eino-Demo application
  - job_name: 'eino-demo'
    static_configs:
      - targets: ['host.docker.internal:19090']
        labels:
          instance: 'eino-demo'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

  # Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          instance: 'jaeger'

  # PostgreSQL exporter (requires postgres_exporter sidecar)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          instance: 'postgres'

  # Redis exporter (requires redis_exporter sidecar)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          instance: 'redis'
