openapi: "3.0.3"
info:
  title: Eino Demo API
  version: "1.0.0"
  description: Shared API types for Go and TypeScript code generation.
    This spec defines both HTTP endpoint types and WebSocket envelope types.

paths:
  # ── Health ──
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # ── Users ──
  /users/me:
    get:
      summary: Get current user (with embedded settings)
      responses:
        "200":
          description: Current user with settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /users/me/updates:
    get:
      summary: Poll for user updates (HTTP fallback)
      parameters:
        - name: last_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Updates wrapper with pagination cursor
          content:
            application/json:
              schema:
                type: object
                required: [updates, max_seq, has_more]
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Update"
                  max_seq:
                    type: integer
                    format: int64
                  has_more:
                    type: boolean

  # ── Templates ──
  /templates:
    get:
      summary: List available templates
      responses:
        "200":
          description: Array of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      summary: Get template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Template not found

  /templates/{id}/projects:
    post:
      summary: Create a project from a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  # ── Projects ──
  /projects:
    get:
      summary: List current user's projects
      responses:
        "200":
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
    put:
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                config:
                  type: object
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found

  # ── Conversations ──
  /projects/{id}/conversations:
    get:
      summary: List conversations in a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      summary: Create a conversation in a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  project_id:
                    type: string
                  user_id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time

  /conversations/{id}:
    patch:
      summary: Update a conversation (title only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: New conversation title
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
        "404":
          description: Conversation not found
    delete:
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation deleted
        "404":
          description: Conversation not found

  /conversations/{id}/members:
    get:
      summary: List conversation members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of members
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    conversation_id:
                      type: string
                    member_type:
                      type: string
                    member_id:
                      type: string
                    member_name:
                      type: string
                    is_owner:
                      type: boolean

  # ── Messages ──
  /conversations/{id}/messages:
    get:
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      summary: Send a message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                  message_id:
                    type: string
                  seq:
                    type: integer

  # ── Chat Control ──
  /conversations/{id}/stop:
    post:
      summary: Stop active streaming in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streaming stopped

  # ── Settings ──
  /settings:
    get:
      summary: Get current user's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      summary: Update settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model_tier:
                  type: string
                  enum: [haiku, sonnet, opus]
                locale:
                  type: string
                  enum: [en, zh]
                theme:
                  type: string
                  enum: [light, dark]
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ── Models ──
  /models:
    get:
      summary: List available AI models
      responses:
        "200":
          description: Array of model info
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      required: [name, base_url, model]
                      properties:
                        name:
                          type: string
                        base_url:
                          type: string
                        model:
                          type: string

components:
  schemas:
    # ── HTTP Entity Types ──

    User:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [id, settings]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        settings:
          $ref: "#/components/schemas/Settings"

    Template:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]

    Project:
      type: object
      required: [id, user_id, template_id, name]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        template_id:
          type: string
        name:
          type: string
        config:
          type: object
        created_at:
          type: string
          format: date-time

    Conversation:
      type: object
      required: [id, project_id, user_id]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        status:
          type: string
        last_preview:
          type: string
        message_count:
          type: integer
        latest_seq:
          type: integer
        member_count:
          type: integer
        token_prompt:
          type: integer
        token_completion:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, conversation_id, seq, sender_role, content]
      properties:
        id:
          type: string
        conversation_id:
          type: string
        seq:
          type: integer
        sender_role:
          type: string
          enum: [user, assistant, system, tool]
        sender_id:
          type: string
        content:
          type: string
        reason_content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        finish_reason:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        token_prompt:
          type: integer
        token_completion:
          type: integer
        created_at:
          type: string
          format: date-time
        reply_to_seq:
          type: integer
        mentioned_members:
          type: array
          items:
            type: string
        tool_calling:
          type: object
          nullable: true
          properties:
            input:
              type: object
              additionalProperties: true
              description: Tool call input arguments
            output:
              type: string
              description: Tool call output result
        updated_at:
          type: string
          format: date-time

    Settings:
      type: object
      properties:
        model_tier:
          type: string
          enum: [haiku, sonnet, opus]
        locale:
          type: string
          enum: [en, zh]
        theme:
          type: string
          enum: [light, dark]
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    # ── WebSocket Envelope ──
    # All WS frames share { "type": string, "payload": object }

    WSClientFrame:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [ping]
          description: Client→Server frames. Only heartbeat.
        payload:
          $ref: "#/components/schemas/PingPayload"

    WSServerFrame:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [updates, connected]
          description: Server→Client frame types.
        payload:
          oneOf:
            - $ref: "#/components/schemas/ConnectedPayload"
            - type: array
              items:
                $ref: "#/components/schemas/Update"

    # ── Heartbeat ──

    PingPayload:
      type: object
      description: Client heartbeat. Sent every 30 seconds.
      properties: {}

    # ── Connection ──

    ConnectedPayload:
      type: object
      required: [user_id, server_time, max_seq]
      properties:
        user_id:
          type: string
        server_time:
          type: string
          format: date-time
        max_seq:
          type: integer
          description: Server's current highest seq for this user.

    # ── Update Payload Types ──
    # Each Update type has a concrete payload schema.
    # Backend constructs these as typed maps; frontend reads them via discriminated union.

    EmptyPayload:
      type: object
      description: Seq gap filler. No data.
      properties: {}

    MessageNewPayload:
      type: object
      required: [conversation_id, message_id, seq, role, sender_id, addr]
      properties:
        conversation_id:
          type: string
          description: UUID of the conversation.
        message_id:
          type: string
          description: UUID of the message.
        seq:
          type: integer
          format: int64
        role:
          type: string
          enum: [user, assistant, system, tool]
        sender_id:
          type: string
        addr:
          type: string
          description: Eino callback address string.
        tool_name:
          type: string
          description: Only present when role is "tool".
        content:
          type: string
          description: Message content. Present for user messages.

    MessageDeltaPayload:
      type: object
      required: [conversation_id, message_id, delta, addr]
      properties:
        conversation_id:
          type: string
        message_id:
          type: string
        delta:
          type: string
          description: Streaming text chunk.
        addr:
          type: string

    MessageDonePayload:
      type: object
      required: [conversation_id, message_id, role, sender_id, content, reasoning_content, addr, seq]
      properties:
        conversation_id:
          type: string
        message_id:
          type: string
        role:
          type: string
        sender_id:
          type: string
        content:
          type: string
          description: Full final content.
        reasoning_content:
          type: string
          description: Full reasoning content.
        addr:
          type: string
        seq:
          type: integer
          format: int64

    MessageToolCallPayload:
      type: object
      required: [conversation_id, message_id, tool_name, content, seq, addr]
      properties:
        conversation_id:
          type: string
        message_id:
          type: string
        tool_name:
          type: string
        content:
          type: string
          description: Truncated result (max 200 chars).
        seq:
          type: integer
          format: int64
        addr:
          type: string

    MessageThinkingPayload:
      type: object
      required: [conversation_id, message_id, delta, addr]
      properties:
        conversation_id:
          type: string
        message_id:
          type: string
        delta:
          type: string
          description: Streaming reasoning chunk.
        addr:
          type: string

    MessageErrorPayload:
      type: object
      required: [conversation_id, error, seq]
      properties:
        conversation_id:
          type: string
        error:
          type: string
        seq:
          type: integer
          format: int64
        message_id:
          type: string
          description: UUID of the interrupted message (optional).
        checkpoint_id:
          type: string
          description: Checkpoint ID for interrupt/resume (optional).

    MessageStopPayload:
      type: object
      required: [conversation_id, seq]
      properties:
        conversation_id:
          type: string
        seq:
          type: integer
          format: int64
        message_id:
          type: string
          description: UUID of the stopped message (optional).

    ConversationUpdatedPayload:
      type: object
      required: [conversation_id, seq]
      properties:
        conversation_id:
          type: string
        seq:
          type: integer
          format: int64
        title:
          type: string
        title_generated:
          type: boolean
          description: True if the title was auto-generated by the title agent.
        token_prompt:
          type: integer
          format: int64
          description: Estimated prompt token count for the conversation.
        token_completion:
          type: integer
          format: int64
          description: Estimated completion token count for the conversation.

    ConversationCreatedPayload:
      type: object
      required: [id, project_id, seq]
      properties:
        id:
          type: string
          description: UUID of the conversation.
        project_id:
          type: string
          description: UUID of the project.
        title:
          type: string
        status:
          type: string
        seq:
          type: integer
          format: int64

    ConversationDeletedPayload:
      type: object
      required: [id, project_id, seq]
      properties:
        id:
          type: string
        project_id:
          type: string
        seq:
          type: integer
          format: int64

    ConversationCompactingPayload:
      type: object
      required: [conversation_id, seq]
      properties:
        conversation_id:
          type: string
          description: "Conversation being compacted"
        seq:
          type: integer
          format: int64

    ConversationCompactedPayload:
      type: object
      required: [old_conv_id, new_conv_id, project_id, seq]
      properties:
        old_conv_id:
          type: string
          description: "Original conversation ID"
        new_conv_id:
          type: string
          description: "New conversation ID after compaction"
        project_id:
          type: string
          description: "Parent project ID"
        seq:
          type: integer
          format: int64

    ConversationCompressedPayload:
      type: object
      required: [conversation_id, min_seq, seq]
      properties:
        conversation_id:
          type: string
          description: "Conversation that was compressed"
        min_seq:
          type: integer
          format: int64
          description: "New compression cursor. Messages below this seq have been compressed."
        summary:
          type: string
          description: "LLM-generated summary of compressed messages"
        message_id:
          type: string
          description: "ID of the inserted summary message (optional)"
        seq:
          type: integer
          format: int64

    ConversationArchivedPayload:
      type: object
      required: [conversation_id, seq]
      properties:
        conversation_id:
          type: string
        seq:
          type: integer
          format: int64

    ProjectCreatedPayload:
      type: object
      required: [id, template_id, name, seq]
      properties:
        id:
          type: string
          description: UUID of the project.
        template_id:
          type: string
        name:
          type: string
        seq:
          type: integer
          format: int64

    ProjectDeletedPayload:
      type: object
      required: [id, seq]
      properties:
        id:
          type: string
        seq:
          type: integer
          format: int64

    SettingsChangedPayload:
      type: object
      required: [seq, model_tier, locale, theme, changed]
      properties:
        seq:
          type: integer
          format: int64
        model_tier:
          type: string
          enum: [haiku, sonnet, opus]
        locale:
          type: string
          enum: [en, zh]
        theme:
          type: string
          enum: [light, dark]
        changed:
          type: array
          items:
            type: string
          description: Fields that were changed.

    # ── Update (unified event type) ──
    # payload is a oneOf of all concrete payload types.
    # Frontend uses discriminated union: switch on Update.type to narrow payload type.
    # Backend constructs payloads as map[string]interface{} (JSONMap) — generated types
    # serve as documentation and frontend type safety.

    Update:
      type: object
      required: [seq, type, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: "> 0 = persisted and replayable. 0 = ephemeral (streaming)."
        type:
          type: string
          enum:
            # Message-level events
            - message.new
            - message.delta
            - message.done
            - message.tool_call
            - message.thinking
            - message.error
            - message.stop
            # Conversation-level events
            - conversation.created
            - conversation.updated
            - conversation.deleted
            - conversation.compressed
            - conversation.compacting
            - conversation.compacted
            - conversation.archived
            # Project-level events
            - project.created
            - project.deleted
            # Settings-level events
            - settings.changed
            # Technical events
            - empty
        payload:
          oneOf:
            - $ref: "#/components/schemas/MessageNewPayload"
            - $ref: "#/components/schemas/MessageDeltaPayload"
            - $ref: "#/components/schemas/MessageDonePayload"
            - $ref: "#/components/schemas/MessageToolCallPayload"
            - $ref: "#/components/schemas/MessageThinkingPayload"
            - $ref: "#/components/schemas/MessageErrorPayload"
            - $ref: "#/components/schemas/MessageStopPayload"
            - $ref: "#/components/schemas/ConversationCreatedPayload"
            - $ref: "#/components/schemas/ConversationUpdatedPayload"
            - $ref: "#/components/schemas/ConversationDeletedPayload"
            - $ref: "#/components/schemas/ConversationCompressedPayload"
            - $ref: "#/components/schemas/ConversationCompactingPayload"
            - $ref: "#/components/schemas/ConversationCompactedPayload"
            - $ref: "#/components/schemas/ConversationArchivedPayload"
            - $ref: "#/components/schemas/ProjectCreatedPayload"
            - $ref: "#/components/schemas/ProjectDeletedPayload"
            - $ref: "#/components/schemas/SettingsChangedPayload"
            - $ref: "#/components/schemas/EmptyPayload"
          description: "Type-specific entity. Discriminated by Update.type. Frontend extracts conversation_id from payload to derive topic."
